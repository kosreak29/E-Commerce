<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="store-container">
        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" alt="Wireless Headphones">
        </div>
        <div class="product-details">
            <h1>Sony WH-1000XM4</h1>
            <p class="description">Industry-leading noise canceling wireless headphones with premium sound quality.</p>
            <div class="price-box">
                <span class="mrp">₹2,500</span>
                <span class="final-price">₹2,000</span>
                <span class="offer-tag">20% OFF applied</span>
            </div>
            
            <div class="checkout-section">
                <label for="phoneInput">WhatsApp Number (For Order Updates):</label>
                <input type="text" id="phoneInput" placeholder="+919876543210" required>
                
                <button id="buyBtn">Place Order Securely</button>
            </div>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
